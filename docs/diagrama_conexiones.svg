<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" font-family="Segoe UI, Roboto, sans-serif">
  <rect width="1060" height="780" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="530" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Estación de Monitoreo Ambiental — Diagrama de conexiones</text>
  <text x="530" y="60" text-anchor="middle" font-size="14" fill="#64748b">ESP32-C6 · Instrumentación Electrónica · UNAL</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#334155">
    <rect x="40" y="78" width="14" height="14" fill="#dc2626"/><text x="60" y="90">Alimentación (3V3 / 5V / 12V)</text>
    <rect x="245" y="78" width="14" height="14" fill="#0f172a"/><text x="265" y="90">GND</text>
    <rect x="330" y="78" width="14" height="14" fill="#2563eb"/><text x="350" y="90">Señal / GPIO</text>
  </g>

  <!-- ===================== MCU ===================== -->
  <rect x="430" y="150" width="200" height="420" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="530" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#22d3ee">ESP32-C6</text>
  <text x="530" y="200" text-anchor="middle" font-size="11" fill="#94a3b8">DevKitC-1</text>

  <!-- Pines izquierda (etiquetas) -->
  <g font-size="13" fill="#e2e8f0" text-anchor="start">
    <text x="442" y="244">3V3</text>
    <text x="442" y="300">GPIO4</text>
    <text x="442" y="356">GPIO1</text>
    <text x="442" y="430">GPIO2</text>
    <text x="442" y="486">GPIO18</text>
    <text x="442" y="556">GND</text>
  </g>
  <!-- Pines derecha (etiquetas) -->
  <g font-size="13" fill="#e2e8f0" text-anchor="end">
    <text x="618" y="244">GPIO8</text>
    <text x="618" y="300">GPIO11</text>
    <text x="618" y="356">GPIO12</text>
    <text x="618" y="430">GPIO13</text>
    <text x="618" y="556">GND</text>
  </g>

  <!-- ===================== Componentes izquierda ===================== -->
  <!-- DHT22 -->
  <rect x="60" y="270" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="135" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">DHT22</text>
  <text x="135" y="313" text-anchor="middle" font-size="11" fill="#64748b">Temp + Humedad</text>
  <line x1="210" y1="298" x2="430" y2="293" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#2563eb">DATA · pull-up 4.7kΩ→3V3</text>

  <!-- MQ-135 -->
  <rect x="60" y="340" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="135" y="365" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">MQ-135</text>
  <text x="135" y="383" text-anchor="middle" font-size="11" fill="#64748b">Gas (VCC=5V)</text>
  <line x1="210" y1="362" x2="430" y2="350" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="343" text-anchor="middle" font-size="11" fill="#2563eb">AOUT · divisor ≤3.3V (ADC)</text>

  <!-- Boton PROV -->
  <rect x="60" y="412" width="150" height="44" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="135" y="431" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Botón PROV</text>
  <text x="135" y="448" text-anchor="middle" font-size="10" fill="#64748b">arranque → portal</text>
  <line x1="210" y1="434" x2="430" y2="425" stroke="#2563eb" stroke-width="2"/>
  <line x1="135" y1="456" x2="135" y2="700" stroke="#0f172a" stroke-width="2"/>

  <!-- Boton RESET -->
  <rect x="60" y="468" width="150" height="44" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="135" y="487" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Botón RESET</text>
  <text x="135" y="504" text-anchor="middle" font-size="10" fill="#64748b">3s → borra config</text>
  <line x1="210" y1="490" x2="430" y2="481" stroke="#2563eb" stroke-width="2"/>
  <line x1="170" y1="512" x2="170" y2="700" stroke="#0f172a" stroke-width="2"/>

  <!-- ===================== Componentes derecha ===================== -->
  <!-- LED RGB -->
  <rect x="850" y="216" width="160" height="50" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="930" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">LED RGB WS2812</text>
  <text x="930" y="255" text-anchor="middle" font-size="10" fill="#64748b">onboard (estado)</text>
  <line x1="630" y1="240" x2="850" y2="241" stroke="#2563eb" stroke-width="2"/>

  <!-- LED alarma -->
  <rect x="850" y="280" width="160" height="46" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="930" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">LED alarma</text>
  <text x="930" y="317" text-anchor="middle" font-size="10" fill="#64748b">R 330Ω → GND</text>
  <line x1="630" y1="296" x2="850" y2="300" stroke="#2563eb" stroke-width="2"/>

  <!-- Buzzer -->
  <rect x="850" y="340" width="160" height="46" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="930" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Buzzer activo</text>
  <text x="930" y="377" text-anchor="middle" font-size="10" fill="#64748b">(−) → GND</text>
  <line x1="630" y1="356" x2="850" y2="360" stroke="#2563eb" stroke-width="2"/>

  <!-- ===================== MOSFET + Ventilador ===================== -->
  <rect x="700" y="430" width="310" height="180" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="855" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Etapa de potencia</text>

  <!-- MOSFET -->
  <text x="740" y="500" font-size="13" font-weight="600" fill="#0f172a">IRLZ44N</text>
  <line x1="630" y1="425" x2="720" y2="490" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="478" font-size="11" fill="#2563eb">Gate · R 150Ω</text>
  <text x="720" y="520" font-size="11" fill="#334155">G  D — (−) ventilador</text>
  <text x="720" y="538" font-size="11" fill="#334155">S → GND · pulldown 10kΩ</text>

  <!-- Ventilador -->
  <circle cx="900" cy="520" r="30" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="900" y="516" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">FAN</text>
  <text x="900" y="530" text-anchor="middle" font-size="10" fill="#0369a1">12V</text>
  <text x="855" y="580" text-anchor="middle" font-size="10" fill="#9a3412">Diodo flyback 1N4007 en paralelo</text>
  <line x1="900" y1="558" x2="900" y2="700" stroke="#0f172a" stroke-width="2"/>
  <line x1="900" y1="490" x2="900" y2="650" stroke="#dc2626" stroke-width="2"/>

  <!-- ===================== Fuente 12V ===================== -->
  <rect x="700" y="640" width="190" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="795" y="665" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Fuente 12V DC</text>
  <text x="795" y="683" text-anchor="middle" font-size="10" fill="#991b1b">+12V → FAN  ·  GND común</text>
  <line x1="795" y1="650" x2="900" y2="650" stroke="#dc2626" stroke-width="2"/>

  <!-- ===================== Riel GND comun ===================== -->
  <line x1="120" y1="700" x2="980" y2="700" stroke="#0f172a" stroke-width="3"/>
  <line x1="475" y1="556" x2="475" y2="700" stroke="#0f172a" stroke-width="2"/>
  <text x="530" y="724" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">GND COMÚN  (ESP32 · MOSFET · Fuente 12V)</text>
  <!-- simbolo tierra -->
  <g stroke="#0f172a" stroke-width="2">
    <line x1="550" y1="700" x2="550" y2="740"/>
    <line x1="535" y1="740" x2="565" y2="740"/>
    <line x1="540" y1="748" x2="560" y2="748"/>
    <line x1="545" y1="756" x2="555" y2="756"/>
  </g>

  <!-- Notas -->
  <rect x="40" y="540" width="360" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="562" font-size="13" font-weight="700" fill="#0f172a">Notas críticas</text>
  <g font-size="11" fill="#334155">
    <text x="56" y="582">• GND común obligatorio (ESP + MOSFET + fuente).</text>
    <text x="56" y="600">• IRLZ44N es lógico: abre con 3.3V. No usar IRF540.</text>
    <text x="56" y="618">• Diodo flyback indispensable (carga inductiva).</text>
    <text x="56" y="636">• MQ-135 heater a 5V; AOUT con divisor a ≤3.3V.</text>
    <text x="56" y="654">• Botones a GND con pull-up interno del ESP32.</text>
  </g>
</svg>
