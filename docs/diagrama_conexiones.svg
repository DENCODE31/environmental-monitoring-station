<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/><stop offset="1" stop-color="#16243b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eaed"/><stop offset="0.5" stop-color="#c2c7cc"/><stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe89a"/><stop offset="1" stop-color="#c9a227"/>
    </radialGradient>
    <linearGradient id="modblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="1" stop-color="#71717a"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1020" fill="#fbfcfe"/>
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">Estación de Monitoreo Ambiental — Diagrama de conexiones</text>
  <text x="700" y="64" text-anchor="middle" font-size="14" fill="#64748b">ESP32-C6-DevKitC-1 · Instrumentación Electrónica · UNAL</text>

  <!-- ====== Riel GND (negro) ====== -->
  <line x1="48" y1="150" x2="48" y2="950" stroke="#111827" stroke-width="5"/>
  <text x="60" y="958" font-size="13" font-weight="700" fill="#111827">GND COMÚN</text>
  <g stroke="#111827" stroke-width="3">
    <line x1="48" y1="950" x2="48" y2="975"/><line x1="33" y1="975" x2="63" y2="975"/>
    <line x1="38" y1="983" x2="58" y2="983"/><line x1="43" y1="991" x2="53" y2="991"/>
  </g>

  <!-- =========================================================
       PLACA ESP32-C6-DevKitC-1
  ========================================================== -->
  <g>
    <rect x="620" y="130" width="160" height="680" rx="14" fill="url(#pcb)" stroke="#0b1626" stroke-width="2"/>
    <!-- Antena PCB -->
    <g stroke="#caa84a" stroke-width="2" fill="none">
      <path d="M662 150 h76 v10 h-76 v10 h76 v10 h-76 v10 h76"/>
    </g>
    <!-- Modulo WROOM-1 -->
    <rect x="644" y="208" width="112" height="300" rx="8" fill="url(#shield)" stroke="#6b7280"/>
    <text x="700" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">ESP32-C6</text>
    <text x="700" y="268" text-anchor="middle" font-size="11" fill="#4b5563">WROOM-1</text>
    <circle cx="700" cy="320" r="16" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="700" y="324" text-anchor="middle" font-size="9" fill="#6b7280">FCC</text>
    <!-- LED RGB onboard -->
    <rect x="690" y="530" width="20" height="20" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="700" cy="540" r="5" fill="#ef4444"/>
    <text x="700" y="572" text-anchor="middle" font-size="10" fill="#e2e8f0">RGB·GPIO8</text>
    <!-- Botones BOOT / RST -->
    <rect x="648" y="600" width="36" height="30" rx="5" fill="#1f2937" stroke="#0b1626"/>
    <circle cx="666" cy="615" r="8" fill="#374151"/>
    <text x="666" y="648" text-anchor="middle" font-size="9" fill="#e2e8f0">BOOT</text>
    <rect x="716" y="600" width="36" height="30" rx="5" fill="#1f2937" stroke="#0b1626"/>
    <circle cx="734" cy="615" r="8" fill="#374151"/>
    <text x="734" y="648" text-anchor="middle" font-size="9" fill="#e2e8f0">RST</text>
    <!-- USB-C dobles -->
    <rect x="636" y="772" width="50" height="40" rx="6" fill="url(#metal)" stroke="#52525b"/>
    <rect x="714" y="772" width="50" height="40" rx="6" fill="url(#metal)" stroke="#52525b"/>
    <text x="661" y="800" text-anchor="middle" font-size="8" fill="#27272a">UART</text>
    <text x="739" y="800" text-anchor="middle" font-size="8" fill="#27272a">USB</text>

    <!-- Pads IZQUIERDA -->
    <!-- y = 170 + i*42 -->
    <g>
      <circle cx="624" cy="170" r="7" fill="url(#gold)"/><text x="638" y="174" font-size="11" font-weight="600" fill="#e2e8f0">3V3</text>
      <circle cx="624" cy="212" r="7" fill="url(#gold)"/><text x="638" y="216" font-size="11" fill="#cbd5e1">RST</text>
      <circle cx="624" cy="254" r="7" fill="url(#gold)"/><text x="638" y="258" font-size="11" font-weight="600" fill="#e2e8f0">GND</text>
      <circle cx="624" cy="296" r="7" fill="url(#gold)"/><text x="638" y="300" font-size="11" font-weight="600" fill="#e2e8f0">IO4</text>
      <circle cx="624" cy="338" r="7" fill="url(#gold)"/><text x="638" y="342" font-size="11" fill="#cbd5e1">IO5</text>
      <circle cx="624" cy="380" r="7" fill="url(#gold)"/><text x="638" y="384" font-size="11" fill="#cbd5e1">IO6</text>
      <circle cx="624" cy="422" r="7" fill="url(#gold)"/><text x="638" y="426" font-size="11" fill="#cbd5e1">IO7</text>
      <circle cx="624" cy="464" r="7" fill="url(#gold)"/><text x="638" y="468" font-size="11" fill="#cbd5e1">IO0</text>
      <circle cx="624" cy="506" r="7" fill="url(#gold)"/><text x="638" y="510" font-size="11" font-weight="600" fill="#e2e8f0">IO1</text>
      <circle cx="624" cy="548" r="7" fill="url(#gold)"/><text x="638" y="552" font-size="11" fill="#cbd5e1">IO8</text>
      <circle cx="624" cy="590" r="7" fill="url(#gold)"/><text x="638" y="594" font-size="11" fill="#cbd5e1">IO10</text>
      <circle cx="624" cy="632" r="7" fill="url(#gold)"/><text x="638" y="636" font-size="11" font-weight="600" fill="#e2e8f0">IO11</text>
      <circle cx="624" cy="674" r="7" fill="url(#gold)"/><text x="638" y="678" font-size="11" font-weight="600" fill="#e2e8f0">IO12</text>
      <circle cx="624" cy="716" r="7" fill="url(#gold)"/><text x="638" y="720" font-size="11" font-weight="600" fill="#e2e8f0">IO13</text>
      <circle cx="624" cy="758" r="7" fill="url(#gold)"/><text x="638" y="762" font-size="11" font-weight="600" fill="#e2e8f0">5V</text>
    </g>
    <!-- Pads DERECHA -->
    <!-- y = 175 + i*42 -->
    <g text-anchor="end">
      <circle cx="776" cy="175" r="7" fill="url(#gold)"/><text x="762" y="179" font-size="11" font-weight="600" fill="#e2e8f0">GND</text>
      <circle cx="776" cy="217" r="7" fill="url(#gold)"/><text x="762" y="221" font-size="11" font-weight="600" fill="#e2e8f0">IO2</text>
      <circle cx="776" cy="259" r="7" fill="url(#gold)"/><text x="762" y="263" font-size="11" fill="#cbd5e1">IO3</text>
      <circle cx="776" cy="301" r="7" fill="url(#gold)"/><text x="762" y="305" font-size="11" fill="#cbd5e1">RX</text>
      <circle cx="776" cy="343" r="7" fill="url(#gold)"/><text x="762" y="347" font-size="11" fill="#cbd5e1">TX</text>
      <circle cx="776" cy="385" r="7" fill="url(#gold)"/><text x="762" y="389" font-size="11" fill="#cbd5e1">IO15</text>
      <circle cx="776" cy="427" r="7" fill="url(#gold)"/><text x="762" y="431" font-size="11" fill="#cbd5e1">IO23</text>
      <circle cx="776" cy="469" r="7" fill="url(#gold)"/><text x="762" y="473" font-size="11" fill="#cbd5e1">IO22</text>
      <circle cx="776" cy="511" r="7" fill="url(#gold)"/><text x="762" y="515" font-size="11" fill="#cbd5e1">IO21</text>
      <circle cx="776" cy="553" r="7" fill="url(#gold)"/><text x="762" y="557" font-size="11" fill="#cbd5e1">IO20</text>
      <circle cx="776" cy="595" r="7" fill="url(#gold)"/><text x="762" y="599" font-size="11" fill="#cbd5e1">IO19</text>
      <circle cx="776" cy="637" r="7" fill="url(#gold)"/><text x="762" y="641" font-size="11" font-weight="600" fill="#e2e8f0">IO18</text>
      <circle cx="776" cy="679" r="7" fill="url(#gold)"/><text x="762" y="683" font-size="11" fill="#cbd5e1">IO9</text>
      <circle cx="776" cy="721" r="7" fill="url(#gold)"/><text x="762" y="725" font-size="11" font-weight="600" fill="#e2e8f0">GND</text>
    </g>
  </g>

  <!-- =========================================================
       MODULOS — IZQUIERDA
  ========================================================== -->

  <!-- DHT22 -->
  <g>
    <rect x="150" y="150" width="150" height="92" rx="8" fill="url(#modblue)" stroke="#1e3a8a"/>
    <rect x="166" y="166" width="44" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <g stroke="#cbd5e1" stroke-width="1.5"><line x1="172" y1="176" x2="204" y2="176"/><line x1="172" y1="186" x2="204" y2="186"/><line x1="172" y1="196" x2="204" y2="196"/><line x1="172" y1="206" x2="204" y2="206"/><line x1="172" y1="216" x2="204" y2="216"/></g>
    <text x="258" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">DHT22</text>
    <text x="258" y="198" text-anchor="middle" font-size="10" fill="#dbeafe">Temp+Hum</text>
    <!-- pads derecha -->
    <circle cx="300" cy="200" r="5" fill="url(#gold)"/><text x="292" y="192" text-anchor="end" font-size="10" fill="#fff">VCC</text>
    <circle cx="300" cy="216" r="5" fill="url(#gold)"/><text x="292" y="220" text-anchor="end" font-size="10" fill="#fff">DATA</text>
    <circle cx="300" cy="232" r="5" fill="url(#gold)"/><text x="292" y="236" text-anchor="end" font-size="10" fill="#fff">GND</text>
  </g>

  <!-- MQ-135 -->
  <g>
    <rect x="150" y="330" width="150" height="100" rx="8" fill="url(#modblue)" stroke="#1e3a8a"/>
    <circle cx="194" cy="380" r="26" fill="url(#metal)" stroke="#52525b"/>
    <g stroke="#3f3f46" stroke-width="1"><circle cx="194" cy="380" r="18" fill="none"/><circle cx="194" cy="380" r="11" fill="none"/><line x1="176" y1="380" x2="212" y2="380"/><line x1="194" y1="362" x2="194" y2="398"/></g>
    <text x="262" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MQ-135</text>
    <text x="262" y="378" text-anchor="middle" font-size="10" fill="#dbeafe">Gas / humo</text>
    <circle cx="300" cy="392" r="5" fill="url(#gold)"/><text x="292" y="384" text-anchor="end" font-size="10" fill="#fff">VCC</text>
    <circle cx="300" cy="408" r="5" fill="url(#gold)"/><text x="292" y="412" text-anchor="end" font-size="10" fill="#fff">GND</text>
    <circle cx="300" cy="424" r="5" fill="url(#gold)"/><text x="292" y="428" text-anchor="end" font-size="10" fill="#fff">AOUT</text>
  </g>

  <!-- LED alarma + resistor -->
  <g>
    <rect x="150" y="470" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="225" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">LED alarma</text>
    <circle cx="186" cy="516" r="11" fill="#ef4444" stroke="#991b1b"/>
    <path d="M210 516 h10 l5 -7 v14 l5 -7 v14 l5 -7 h10" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text x="270" y="520" font-size="10" fill="#475569">330Ω</text>
    <circle cx="300" cy="506" r="5" fill="url(#gold)"/><text x="292" y="500" text-anchor="end" font-size="10" fill="#334155">A</text>
    <circle cx="300" cy="528" r="5" fill="#111827"/><text x="292" y="532" text-anchor="end" font-size="10" fill="#334155">K</text>
  </g>

  <!-- Buzzer -->
  <g>
    <rect x="150" y="565" width="150" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="190" cy="597" r="20" fill="#18181b" stroke="#3f3f46"/>
    <circle cx="190" cy="597" r="5" fill="#3f3f46"/>
    <text x="190" y="585" text-anchor="middle" font-size="10" fill="#fbbf24">+</text>
    <text x="255" y="593" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Buzzer</text>
    <text x="255" y="609" text-anchor="middle" font-size="10" fill="#64748b">activo</text>
    <circle cx="300" cy="588" r="5" fill="url(#gold)"/><text x="292" y="582" text-anchor="end" font-size="10" fill="#334155">+</text>
    <circle cx="300" cy="610" r="5" fill="#111827"/><text x="292" y="614" text-anchor="end" font-size="10" fill="#334155">−</text>
  </g>

  <!-- MOSFET + Fan + 12V (bloque potencia) -->
  <g>
    <rect x="120" y="670" width="430" height="250" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="335" y="694" text-anchor="middle" font-size="14" font-weight="800" fill="#9a3412">Etapa de potencia (12 V)</text>

    <!-- MOSFET TO-220 -->
    <rect x="160" y="730" width="70" height="90" rx="6" fill="#27272a" stroke="#000"/>
    <rect x="160" y="724" width="70" height="16" rx="3" fill="url(#metal)"/>
    <circle cx="195" cy="732" r="5" fill="#3f3f46"/>
    <text x="195" y="772" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">IRLZ44N</text>
    <line x1="175" y1="820" x2="175" y2="850" stroke="#52525b" stroke-width="3"/><text x="175" y="866" text-anchor="middle" font-size="10" fill="#334155">G</text>
    <line x1="195" y1="820" x2="195" y2="850" stroke="#52525b" stroke-width="3"/><text x="195" y="866" text-anchor="middle" font-size="10" fill="#334155">D</text>
    <line x1="215" y1="820" x2="215" y2="850" stroke="#52525b" stroke-width="3"/><text x="215" y="866" text-anchor="middle" font-size="10" fill="#334155">S</text>
    <text x="120" y="900" font-size="10" fill="#9a3412">G: R 150Ω + pulldown 10kΩ→GND</text>

    <!-- Ventilador -->
    <circle cx="370" cy="780" r="42" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <g fill="#0369a1"><path d="M370 780 q-30 -18 -8 -34 q14 16 8 34"/><path d="M370 780 q18 -30 34 -8 q-16 14 -34 8"/><path d="M370 780 q30 18 8 34 q-14 -16 -8 -34"/><path d="M370 780 q-18 30 -34 8 q16 -14 34 -8"/></g>
    <circle cx="370" cy="780" r="7" fill="#0c4a6e"/>
    <text x="370" y="838" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">FAN 12V</text>
    <text x="370" y="730" text-anchor="middle" font-size="9" fill="#0369a1">(+)</text>
    <!-- Diodo flyback -->
    <g stroke="#9a3412" stroke-width="2" fill="none">
      <path d="M448 740 l0 80" />
      <path d="M448 760 l14 0 m0 0 l-7 12 l-7 -12 z" fill="#9a3412"/>
      <line x1="455" y1="772" x2="441" y2="772"/>
    </g>
    <text x="480" y="784" font-size="10" fill="#9a3412">flyback</text>
    <text x="480" y="798" font-size="10" fill="#9a3412">1N4007</text>

    <!-- Fuente 12V -->
    <rect x="300" y="858" width="150" height="48" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="375" y="880" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Fuente 12V DC</text>
    <text x="375" y="897" text-anchor="middle" font-size="9" fill="#991b1b">+12V / GND común</text>
  </g>

  <!-- =========================================================
       MODULOS — DERECHA (botones)
  ========================================================== -->
  <g>
    <rect x="980" y="180" width="150" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="1000" y="200" width="40" height="40" rx="5" fill="#1f2937"/>
    <circle cx="1020" cy="220" r="11" fill="#374151"/>
    <text x="1085" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Botón PROV</text>
    <text x="1085" y="232" text-anchor="middle" font-size="10" fill="#64748b">arranque → portal</text>
    <circle cx="980" cy="210" r="5" fill="#2563eb"/>
    <circle cx="980" cy="240" r="5" fill="#111827"/>
  </g>
  <g>
    <rect x="980" y="320" width="150" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="1000" y="340" width="40" height="40" rx="5" fill="#1f2937"/>
    <circle cx="1020" cy="360" r="11" fill="#374151"/>
    <text x="1085" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Botón RESET</text>
    <text x="1085" y="372" text-anchor="middle" font-size="10" fill="#64748b">3s → borra config</text>
    <circle cx="980" cy="350" r="5" fill="#2563eb"/>
    <circle cx="980" cy="380" r="5" fill="#111827"/>
  </g>

  <!-- =========================================================
       CABLEADO
  ========================================================== -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- DHT22 VCC → 3V3 (rojo) -->
    <path d="M300 200 C 360 200, 360 170, 618 170" stroke="#e11d48"/>
    <!-- DHT22 DATA → IO4 (verde) -->
    <path d="M300 216 C 420 216, 470 296, 618 296" stroke="#16a34a"/>
    <!-- DHT22 GND → riel (negro) -->
    <path d="M300 232 C 110 232, 110 232, 53 232" stroke="#111827"/>

    <!-- MQ VCC → 5V (naranja) -->
    <path d="M300 392 C 470 392, 470 758, 618 758" stroke="#f97316"/>
    <!-- MQ GND → riel -->
    <path d="M300 408 C 90 408, 90 408, 53 408" stroke="#111827"/>
    <!-- MQ AOUT → IO1 (cian) -->
    <path d="M300 424 C 460 424, 480 506, 618 506" stroke="#0891b2"/>

    <!-- LED A → IO11 (morado) -->
    <path d="M300 506 C 500 506, 470 632, 618 632" stroke="#7c3aed"/>
    <!-- LED K → riel -->
    <path d="M300 528 C 100 540, 80 540, 53 540" stroke="#111827"/>

    <!-- Buzzer + → IO12 (rosa) -->
    <path d="M300 588 C 520 588, 470 674, 618 674" stroke="#db2777"/>
    <!-- Buzzer - → riel -->
    <path d="M300 610 C 100 620, 80 620, 53 620" stroke="#111827"/>

    <!-- Gate → IO13 (amarillo) -->
    <path d="M175 850 C 175 700, 560 716, 618 716" stroke="#ca8a04"/>
    <!-- Source → riel -->
    <path d="M215 850 C 215 935, 60 935, 48 935" stroke="#111827"/>
    <!-- Drain → Fan(-) (negro grueso) -->
    <path d="M195 850 C 195 900, 330 880, 350 818" stroke="#334155" stroke-width="3"/>
    <!-- Fan(+) → +12V supply (rojo grueso) -->
    <path d="M370 738 C 250 720, 250 858, 300 870" stroke="#dc2626" stroke-width="4"/>
    <!-- 12V GND → riel -->
    <path d="M300 894 C 90 905, 70 905, 48 905" stroke="#111827"/>

    <!-- Btn PROV → IO2 (azul) -->
    <path d="M980 210 C 850 210, 850 217, 783 217" stroke="#2563eb"/>
    <!-- Btn PROV GND → board GND derecha (top) -->
    <path d="M980 240 C 870 240, 870 175, 783 175" stroke="#111827"/>
    <!-- Btn RESET → IO18 (azul) -->
    <path d="M980 350 C 860 350, 860 637, 783 637" stroke="#2563eb"/>
    <!-- Btn RESET GND → board GND derecha (bottom) -->
    <path d="M980 380 C 880 380, 880 721, 783 721" stroke="#111827"/>
  </g>

  <!-- Leyenda -->
  <g font-size="12" fill="#334155">
    <rect x="600" y="850" width="540" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="616" y="872" font-size="13" font-weight="800" fill="#0f172a">Conexiones</text>
    <g font-weight="600">
      <rect x="616" y="882" width="22" height="8" fill="#e11d48"/><text x="644" y="890">3V3</text>
      <rect x="700" y="882" width="22" height="8" fill="#f97316"/><text x="728" y="890">5V</text>
      <rect x="770" y="882" width="22" height="8" fill="#111827"/><text x="798" y="890">GND</text>
      <rect x="850" y="882" width="22" height="8" fill="#dc2626"/><text x="878" y="890">+12V</text>
    </g>
    <text x="616" y="912" font-size="11">IO4→DHT22 DATA · IO1→MQ-135 AOUT · IO11→LED · IO12→Buzzer · IO13→Gate MOSFET</text>
    <text x="616" y="930" font-size="11">IO2→Botón PROV · IO18→Botón RESET · IO8→LED RGB onboard (sin cable)</text>
    <text x="616" y="950" font-size="10.5" fill="#b91c1c" font-weight="600">Nota: verificar que tu placa exponga IO1; si no, mover MQ-135 a IO0 o IO3 (ADC).</text>
  </g>
</svg>
